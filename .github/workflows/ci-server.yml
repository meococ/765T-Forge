name: CI Server

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Restore / Build / Test (ServerOnly)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\765T-Forge.ServerOnly.slnf --locked-mode

      - name: Build
        run: dotnet build .\765T-Forge.ServerOnly.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test .\765T-Forge.ServerOnly.slnf --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-serveronly
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

      - name: Docs drift guard
        shell: pwsh
        run: |
          $hits = Select-String -Path CLAUDE.md,README.md,docs\troubleshooting.md,docs\safety.md,docs\architecture.md,docs\capability-matrix.md,skills\765t-forge\SKILL.md -Pattern 'scaffolded|Phase 0.*scaffold|hardcoded device' -SimpleMatch:$false -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Path $_.LineNumber $_.Line }
            throw "Stale Phase-0 / scaffold language found in agent-facing docs. Sync with docs/capability-matrix.md."
          }
          Write-Host "Docs drift guard passed."
