name: CI Server

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Restore / Build / Test (ServerOnly)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\765T-Forge.ServerOnly.slnf --locked-mode

      - name: Build
        run: dotnet build .\765T-Forge.ServerOnly.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test .\765T-Forge.ServerOnly.slnf --no-build --configuration Release --verbosity normal

      - name: Docs drift guard
        shell: pwsh
        run: |
          $hits = Select-String -Path CLAUDE.md,docs\troubleshooting.md,docs\safety.md -Pattern 'scaffolded|Phase 0.*scaffold|hardcoded device' -SimpleMatch:$false -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Path $_.LineNumber $_.Line }
            throw "Stale Phase-0 / scaffold language found in agent-facing docs. Sync with docs/capability-matrix.md."
          }
          Write-Host "Docs drift guard passed."
