name: CI Plugin (self-hosted)

# Requires a self-hosted Windows runner labelled `autocad-2026` with AutoCAD
# reference assemblies available. Do not enable on GitHub-hosted runners.
#
# This job is gated on the repository variable FORGE_SELFHOSTED_RUNNER because
# GitHub keeps a run queued forever when no runner matches the labels. With no
# runner registered the job is skipped and the run completes, instead of every
# push to master leaving a permanently queued run. Set the variable to the exact
# string `true` once the runner is registered.
#
# Reference roots follow src/Forge.Plugin/Forge.Plugin.csproj:
#   modern -> FORGE_AUTOCAD_MODERN_ROOT, AUTOCAD_2025_ROOT, FORGE_AUTOCAD_ROOT, then discovery
#   legacy -> FORGE_AUTOCAD_LEGACY_ROOT, AUTOCAD_2017_ROOT (only needed for -AllSeries)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/Forge.Plugin/**"
      - "src/Forge.Shared/**"
      - "scripts/build-plugin.ps1"
      - "scripts/pack-release.ps1"
      - ".github/workflows/ci-plugin.yml"

jobs:
  build-plugin:
    name: Build Forge.Plugin
    if: vars.FORGE_SELFHOSTED_RUNNER == 'true'
    runs-on: [self-hosted, Windows, autocad-2026]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build plugin
        shell: pwsh
        run: |
          if (-not ($env:FORGE_AUTOCAD_MODERN_ROOT -or $env:AUTOCAD_2025_ROOT -or $env:FORGE_AUTOCAD_ROOT)) {
            Write-Warning "No modern AutoCAD reference root is set; the build will fall back to discovery of the highest installed AutoCAD. Set FORGE_AUTOCAD_MODERN_ROOT to pin a specific series."
          }
          .\scripts\build-plugin.ps1 -Configuration Release -OutDir artifacts\Forge.Plugin\

      - name: Pack plugin zip
        shell: pwsh
        run: |
          .\scripts\pack-release.ps1 -Configuration Release
          # pack-release also publishes server; upload plugin zip only here

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-plugin
          path: artifacts/release/765T-Forge.Plugin.zip
          if-no-files-found: warn
