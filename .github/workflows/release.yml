name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack-server:
    name: Pack Forge.Server
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and test (ServerOnly)
        shell: pwsh
        run: |
          dotnet restore .\765T-Forge.ServerOnly.slnf --locked-mode
          dotnet test .\765T-Forge.ServerOnly.slnf --configuration Release --no-restore

      - name: Pack server (win-x64) and generate SHA-256 checksums
        shell: pwsh
        run: |
          .\scripts\pack-release.ps1 -Configuration Release -SkipPlugin
          Get-ChildItem artifacts\release\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 artifacts\release\SHA256SUMS.txt

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-server-win-x64
          path: artifacts/release/server/**

      - name: Create GitHub Release (server)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Plugin build requires Autodesk reference assemblies for the target year
  # (`build-plugin.ps1`/`pack-release.ps1 -Year 2025|2026`; `AUTOCAD_2026_ROOT` overrides).
  # GitHub-hosted runners do not include AutoCAD. Maintainers should build
  # the plugin locally (or on a self-hosted runner)
  # and attach Forge.Plugin.dll to the release, or run pack-release.ps1
  # without -SkipPlugin on a machine that has AutoCAD installed.
  pack-plugin-note:
    name: Plugin packaging note
    runs-on: windows-latest
    needs: pack-server
    steps:
      - name: Document plugin expectation
        shell: pwsh
        run: |
          Write-Host @"
          Plugin artifact is NOT built on GitHub-hosted runners (no AutoCAD).
          A release without 765T-Forge.Plugin.zip is INCOMPLETE — server alone is insufficient.
          Do NOT announce the tag as a complete product until the plugin zip is attached.
          Maintainer steps:
            1. Reference assemblies for the target year come from build-plugin.ps1 /
               pack-release.ps1 -Year 2025|2026; AUTOCAD_2026_ROOT overrides the default root.
            2. Run: .\scripts\pack-release.ps1 -Configuration Release
            3. Attach artifacts/release/765T-Forge.Plugin.zip to the GitHub Release for tag $($env:GITHUB_REF_NAME).
            4. Confirm docs/smoke-lab.md has a maintainer pass (or note deferral in release notes).
            5. Confirm server zip contains docs/capability-matrix.md and docs/safety.md.
          See CONTRIBUTING.md release checklist.
          "@
          if ($env:FORGE_REQUIRE_PLUGIN_ZIP -eq "true") {
            throw "FORGE_REQUIRE_PLUGIN_ZIP=true but plugin was not packed on this runner."
          }
