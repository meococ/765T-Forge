name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack-server:
    name: Pack Forge.Server
    runs-on: windows-latest
    outputs:
      server_zip: ${{ steps.pack.outputs.server_zip }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Pack server (win-x64)
        id: pack
        shell: pwsh
        run: |
          .\scripts\pack-release.ps1 -Configuration Release -SkipPlugin
          .\scripts\generate-sbom.ps1 -Configuration Release
          $zip = Get-ChildItem artifacts/release/765T-Forge.Server-win-x64.zip | Select-Object -First 1
          "server_zip=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload server artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-server-win-x64
          path: |
            artifacts/release/765T-Forge.Server-win-x64.zip
            artifacts/release/RELEASE_STATUS.txt
            artifacts/release/765T-Forge.Server.sbom.cdx.json

  pack-plugin:
    name: Pack Forge.Plugin (self-hosted)
    runs-on: [self-hosted, Windows, autocad-2026]
    continue-on-error: true
    outputs:
      plugin_ok: ${{ steps.pack.outputs.plugin_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pack plugin
        id: pack
        shell: pwsh
        run: |
          if (-not $env:AUTOCAD_2026_ROOT) {
            $env:AUTOCAD_2026_ROOT = "C:\Program Files\Autodesk\AutoCAD 2026"
          }
          .\scripts\pack-release.ps1 -Configuration Release
          if (Test-Path artifacts/release/765T-Forge.Plugin.zip) {
            "plugin_ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "plugin_ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "Plugin zip missing — release will stay draft."
          }

      - name: Upload plugin artifact
        if: steps.pack.outputs.plugin_ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-plugin
          path: artifacts/release/765T-Forge.Plugin.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs: [pack-server, pack-plugin]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: forge-server-win-x64
          path: artifacts/release

      - name: Download plugin (optional)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: forge-plugin
          path: artifacts/release

      - name: Assess completeness
        id: status
        shell: pwsh
        run: |
          $plugin = Test-Path "artifacts/release/765T-Forge.Plugin.zip"
          $complete = $plugin
          "complete=$complete" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "draft=$(-not $complete)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $complete) {
            Write-Warning "INCOMPLETE: missing 765T-Forge.Plugin.zip — creating DRAFT release only."
            @"
            765T-Forge release pack status
            ServerZip=yes
            PluginZip=false
            Complete=false
            Note=DRAFT until 765T-Forge.Plugin.zip is attached. Do not announce as complete.
            "@ | Set-Content artifacts/release/RELEASE_STATUS.txt -Encoding utf8
          } else {
            @"
            765T-Forge release pack status
            ServerZip=yes
            PluginZip=true
            Complete=true
            "@ | Set-Content artifacts/release/RELEASE_STATUS.txt -Encoding utf8
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: ${{ steps.status.outputs.draft == 'true' }}
          generate_release_notes: true
          body: |
            ## Install
            Download **both** zips. See [docs/getting-started.md](https://github.com/meococ/765T-Forge/blob/master/docs/getting-started.md).

            | Artifact | Required |
            |----------|----------|
            | `765T-Forge.Server-win-x64.zip` | yes |
            | `765T-Forge.Plugin.zip` | yes (release is draft if missing) |
            | `765T-Forge.Server.sbom.cdx.json` | SBOM |

            Platform: **Windows + AutoCAD 2026** Technical Preview.
          files: |
            artifacts/release/765T-Forge.Server-win-x64.zip
            artifacts/release/765T-Forge.Plugin.zip
            artifacts/release/RELEASE_STATUS.txt
            artifacts/release/765T-Forge.Server.sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
