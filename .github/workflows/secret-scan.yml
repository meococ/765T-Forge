name: Secret Scan (deterministic)

# Deterministic only. No heuristic, entropy, fuzzy, sampling or "probably safe"
# scanning anywhere in this workflow. Every decision below is one of:
#   (a) an explicit boolean gate,
#   (b) an exact schema/value (format) validator,
#   (c) an exact extension match.
# File enumeration is `git ls-files` (tracked files only) — never a glob walk
# over the working tree, so untracked debris can never be scanned or missed.
#
# gitleaks/gitleaks-action is deliberately NOT used here: its rule set is
# entropy/heuristic based and would violate the determinism constraint.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-format-scan:
    name: Exact secret-format validators (tracked files)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for known secret formats
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Exact format validators (schema/value checks). These are literal
          # prefix/length forms for known credential types — not heuristics.
          $rules = @(
            @{ Name = 'aws-access-key-id';       Pattern = 'AKIA[0-9A-Z]{16}' },
            @{ Name = 'pem-private-key-header';  Pattern = '-----BEGIN [A-Z ]*PRIVATE KEY-----' },
            @{ Name = 'github-personal-token';   Pattern = 'ghp_[A-Za-z0-9]{36}' },
            @{ Name = 'github-fine-grained-pat'; Pattern = 'github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}' },
            @{ Name = 'slack-token';             Pattern = 'xox[baprs]-[A-Za-z0-9-]{10,}' }
          )

          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw 'git ls-files failed.' }
          Write-Host ("Scanning {0} tracked file(s)." -f $files.Count)

          $hits = New-Object System.Collections.Generic.List[string]
          foreach ($f in $files) {
            $text = Get-Content -LiteralPath $f -Raw -ErrorAction Stop
            if ($null -eq $text) { continue }
            foreach ($rule in $rules) {
              $m = [regex]::Match($text, $rule.Pattern)
              if ($m.Success) {
                $hits.Add(("{0}: {1} (pattern={2})" -f $f, $rule.Name, $rule.Pattern))
              }
            }
          }

          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host $_ }
            throw ("Secret-format scan failed: {0} exact-format hit(s)." -f $hits.Count)
          }
          Write-Host 'Secret-format scan passed (0 exact-format hits).'

  cad-extension-guard:
    name: No tracked CAD drawing files
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if any tracked file has a CAD drawing extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Exact extension match (ordinal literal equality). Not a heuristic.
          $forbidden = @('.dwg', '.dxf', '.dwf', '.dwt')

          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw 'git ls-files failed.' }
          Write-Host ("Checking {0} tracked file(s)." -f $files.Count)

          $hits = New-Object System.Collections.Generic.List[string]
          foreach ($f in $files) {
            $ext = [System.IO.Path]::GetExtension($f)
            foreach ($bad in $forbidden) {
              if ([string]::Equals($ext, $bad, [System.StringComparison]::OrdinalIgnoreCase)) {
                $hits.Add($f)
              }
            }
          }

          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host $_ }
            throw ("CAD extension guard failed: {0} tracked CAD file(s)." -f $hits.Count)
          }
          Write-Host 'CAD extension guard passed (0 tracked CAD files).'
