name: Publish to MCP Registry

# Manual: run after the NuGet package named in server.json is live on nuget.org.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the MCP Registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check the NuGet package is live
        run: |
          set -euo pipefail
          id="$(jq -r '.packages[0].identifier' server.json | tr '[:upper:]' '[:lower:]')"
          ver="$(jq -r '.packages[0].version' server.json)"
          url="https://api.nuget.org/v3-flatcontainer/${id}/index.json"
          if ! curl --fail --silent --show-error "$url" | jq -e --arg v "$ver" '.versions | index($v)' > /dev/null; then
            echo "::error::${id} ${ver} is not on nuget.org yet; push it first, then re-run."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
